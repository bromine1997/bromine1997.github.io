<link rel="stylesheet" href="/css/custom.css">
<link rel="stylesheet" href="/css/sidebar.css">

<script>
function alignHomeLayout() {
  var sidebar  = document.querySelector('.sidebar');
  var homeInfo = document.querySelector('.first-entry.home-info');
  if (!sidebar || !homeInfo) return;

  var profile = sidebar.querySelector('.sidebar-profile');
  if (!profile) return;

  // 초기화
  homeInfo.style.minHeight = '';
  var firstPost = document.querySelector('.post-entry');
  if (firstPost) firstPost.style.minHeight = '';

  // 사이드바 카테고리 섹션 탐색
  var catSections = Array.from(sidebar.querySelectorAll('.sidebar-section:not(.sidebar-profile)'));
  var algoSection = null, atmegaSection = null;
  catSections.forEach(function(s) {
    var name = s.querySelector('.sidebar-cat-name');
    if (!name) return;
    var t = name.textContent.trim().toLowerCase();
    if (t === 'algorithm')  algoSection  = s;
    if (t === 'atmega')     atmegaSection = s;
  });

  // 빨간 박스: home-info 높이 = 프로필 카드 높이
  homeInfo.style.minHeight = profile.offsetHeight + 'px';

  // 초록 박스: 첫 포스트 카드 높이 = Algorithm 상단 ~ ATmega 하단
  if (algoSection && atmegaSection && firstPost) {
    var algoTop    = algoSection.getBoundingClientRect().top;
    var atmegaBot  = atmegaSection.getBoundingClientRect().bottom;
    var postHeight = atmegaBot - algoTop;
    if (postHeight > 0) firstPost.style.minHeight = postHeight + 'px';
  }
}

document.addEventListener('DOMContentLoaded', alignHomeLayout);
window.addEventListener('load', alignHomeLayout);   // 이미지 로드 후 재계산
window.addEventListener('resize', alignHomeLayout);
</script>

{{ if .Params.math }}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
  onload="renderMathInElement(document.body, {
    delimiters: [
      {left: '$$', right: '$$', display: true},
      {left: '$', right: '$', display: false}
    ],
    throwOnError: false
  });"></script>
{{ end }}
