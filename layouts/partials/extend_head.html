<link rel="stylesheet" href="/css/custom.css">
<link rel="stylesheet" href="/css/sidebar.css">

<script>
function alignHomeLayout() {
  var homeInfo = document.querySelector('.first-entry.home-info');
  var posts    = Array.from(document.querySelectorAll('.post-entry'));

  // 모바일(1열): min-height 해제 후 종료
  if (window.innerWidth <= 900) {
    if (homeInfo) homeInfo.style.minHeight = '';
    posts.forEach(function(p) { p.style.minHeight = ''; });
    return;
  }

  var sidebar = document.querySelector('.sidebar');
  if (!sidebar) return;

  var profile     = sidebar.querySelector('.sidebar-profile');
  var catSections = Array.from(sidebar.querySelectorAll('.sidebar-section:not(.sidebar-profile)'));

  // 모두 초기화
  if (homeInfo) homeInfo.style.minHeight = '';
  posts.forEach(function(p) { p.style.minHeight = ''; });

  // 빨간 박스: home-info 높이 = 프로필 카드 높이
  if (profile && homeInfo) {
    homeInfo.style.minHeight = profile.offsetHeight + 'px';
  }

  // 초록 박스: post[i] → sections[i*2 ~ i*2+1]
  // offsetHeight 기반으로 측정 → 스크롤 위치에 무관하게 정확한 높이 계산
  var sidebarGap = parseFloat(getComputedStyle(sidebar).gap) || 19.2;
  posts.forEach(function(post, i) {
    var sec1 = catSections[i * 2];
    var sec2 = catSections[i * 2 + 1];
    if (!sec1) return;
    var h = sec1.offsetHeight + (sec2 ? sidebarGap + sec2.offsetHeight : 0);
    if (h > 0) post.style.minHeight = h + 'px';
  });
}

document.addEventListener('DOMContentLoaded', alignHomeLayout);
window.addEventListener('load', alignHomeLayout);
window.addEventListener('resize', alignHomeLayout);
// Pretendard 등 외부 폰트 로드 완료 후 재측정
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(alignHomeLayout);
}
</script>

<script>
// 현재 포스트가 속한 사이드바 카테고리 자동 열기
document.addEventListener('DOMContentLoaded', function () {
  var active = document.querySelector('.sidebar-link.active');
  if (active) {
    var details = active.closest('details.sidebar-category');
    if (details) details.open = true;
  }
});
</script>

<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
  onload="renderMathInElement(document.body, {
    delimiters: [
      {left: '$$', right: '$$', display: true},
      {left: '$', right: '$', display: false}
    ],
    throwOnError: false
  });"></script>
{{ end }}
