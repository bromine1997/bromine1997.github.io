<svg width="530" height="520" viewBox="0 0 530 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .addr  { font:9px 'Courier New',monospace; fill:#374151; }
      .rname { font:11px Arial,sans-serif; fill:#1f2937; font-weight:bold; }
      .rdesc { font:9px Arial,sans-serif; fill:#6b7280; }
      .rsub  { font:9px Arial,sans-serif; fill:#9ca3af; }
      .title { font:13px Arial,sans-serif; fill:#1f2937; font-weight:bold; }
      .badge { font:9px Arial,sans-serif; fill:#fff; font-weight:bold; }
    </style>
  </defs>
  <rect width="530" height="520" fill="#fff"/>

  <text x="265" y="20" text-anchor="middle" class="title">ARM Cortex-M 표준 메모리 맵 (ARMv7-M)</text>
  <text x="265" y="33" text-anchor="middle" style="font:9px Arial,sans-serif; fill:#9ca3af">8개 파티션, 각 0.5 GB — ARMv7-M ARM Table B3-1</text>

  <!-- ===== 메모리 바 x=148~288 (width=140) ===== -->
  <!-- 8 blocks, each 57px, y=44~500 -->

  <!-- [7] System: y=44~101 -->
  <rect x="148" y="44" width="140" height="57" fill="#fecaca" stroke="#ef4444" stroke-width="1"/>
  <text x="218" y="67" text-anchor="middle" class="rname" fill="#b91c1c">시스템 영역</text>
  <text x="218" y="80" text-anchor="middle" class="rdesc">NVIC, SysTick, SCB</text>
  <text x="218" y="92" text-anchor="middle" class="rdesc">PPB + Vendor 영역</text>

  <!-- [6] Device Non-shareable: y=101~158 -->
  <rect x="148" y="101" width="140" height="57" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="218" y="124" text-anchor="middle" class="rsub" fill="#6b7280">외부 장치</text>
  <text x="218" y="137" text-anchor="middle" class="rsub">Device, Non-shareable</text>
  <text x="218" y="150" text-anchor="middle" class="rsub">XN (Execute Never)</text>

  <!-- [5] Device Shareable: y=158~215 -->
  <rect x="148" y="158" width="140" height="57" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="218" y="181" text-anchor="middle" class="rsub" fill="#6b7280">외부 장치</text>
  <text x="218" y="194" text-anchor="middle" class="rsub">Device, Shareable</text>
  <text x="218" y="207" text-anchor="middle" class="rsub">XN (Execute Never)</text>

  <!-- [4] External RAM WT: y=215~272 -->
  <rect x="148" y="215" width="140" height="57" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="218" y="238" text-anchor="middle" class="rsub" fill="#9ca3af">외부 RAM</text>
  <text x="218" y="251" text-anchor="middle" class="rsub">Write-Through</text>
  <text x="218" y="264" text-anchor="middle" class="rsub">L2/L3 캐시 지원</text>

  <!-- [3] External RAM WBWA: y=272~329 -->
  <rect x="148" y="272" width="140" height="57" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="218" y="295" text-anchor="middle" class="rsub" fill="#9ca3af">외부 RAM</text>
  <text x="218" y="308" text-anchor="middle" class="rsub">Write-Back, Write-Allocate</text>
  <text x="218" y="321" text-anchor="middle" class="rsub">L2/L3 캐시 지원</text>

  <!-- [2] Peripheral: y=329~386 -->
  <rect x="148" y="329" width="140" height="57" fill="#fde68a" stroke="#d97706" stroke-width="1.2"/>
  <text x="218" y="352" text-anchor="middle" class="rname" fill="#92400e">주변장치 레지스터</text>
  <text x="218" y="365" text-anchor="middle" class="rdesc">GPIO, UART, SPI, I2C</text>
  <text x="218" y="378" text-anchor="middle" class="rdesc">Memory-Mapped I/O, XN</text>

  <!-- [1] SRAM: y=386~443 -->
  <rect x="148" y="386" width="140" height="57" fill="#d1fae5" stroke="#10b981" stroke-width="1.2"/>
  <text x="218" y="409" text-anchor="middle" class="rname" fill="#065f46">SRAM</text>
  <text x="218" y="422" text-anchor="middle" class="rdesc">Stack, Heap</text>
  <text x="218" y="435" text-anchor="middle" class="rdesc">.data (VMA), .bss</text>

  <!-- [0] Code/Flash: y=443~500 -->
  <rect x="148" y="443" width="140" height="57" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/>
  <!-- 벡터 테이블 마커 (최하단 작은 영역) -->
  <rect x="148" y="443" width="140" height="13" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1"/>
  <text x="218" y="453" text-anchor="middle" style="font:8px Arial,sans-serif; fill:#1e40af">벡터 테이블 (0x00000000~)</text>
  <text x="218" y="472" text-anchor="middle" class="rname" fill="#1e3a8a">코드 영역 (Flash)</text>
  <text x="218" y="485" text-anchor="middle" class="rdesc">.text, .rodata, .data(LMA)</text>

  <!-- ===== 경계선 + 주소 레이블 (왼쪽) ===== -->
  <!-- 0xFFFFFFFF (top) -->
  <line x1="90" y1="44" x2="146" y2="44" stroke="#9ca3af" stroke-width="0.8"/>
  <text x="86" y="47" text-anchor="end" class="addr">0xFFFF_FFFF</text>

  <!-- 0xE0000000 -->
  <line x1="90" y1="101" x2="146" y2="101" stroke="#9ca3af" stroke-width="0.8"/>
  <text x="86" y="104" text-anchor="end" class="addr">0xE000_0000</text>

  <!-- 0xC0000000 -->
  <line x1="90" y1="158" x2="146" y2="158" stroke="#9ca3af" stroke-width="0.8"/>
  <text x="86" y="161" text-anchor="end" class="addr">0xC000_0000</text>

  <!-- 0xA0000000 -->
  <line x1="90" y1="215" x2="146" y2="215" stroke="#9ca3af" stroke-width="0.8"/>
  <text x="86" y="218" text-anchor="end" class="addr">0xA000_0000</text>

  <!-- 0x80000000 -->
  <line x1="90" y1="272" x2="146" y2="272" stroke="#9ca3af" stroke-width="0.8"/>
  <text x="86" y="275" text-anchor="end" class="addr">0x8000_0000</text>

  <!-- 0x60000000 -->
  <line x1="90" y1="329" x2="146" y2="329" stroke="#9ca3af" stroke-width="0.8"/>
  <text x="86" y="332" text-anchor="end" class="addr">0x6000_0000</text>

  <!-- 0x40000000 -->
  <line x1="90" y1="386" x2="146" y2="386" stroke="#9ca3af" stroke-width="0.8"/>
  <text x="86" y="389" text-anchor="end" class="addr">0x4000_0000</text>

  <!-- 0x20000000 -->
  <line x1="90" y1="443" x2="146" y2="443" stroke="#9ca3af" stroke-width="0.8"/>
  <text x="86" y="446" text-anchor="end" class="addr">0x2000_0000</text>

  <!-- 0x00000000 (bottom) -->
  <line x1="90" y1="500" x2="146" y2="500" stroke="#9ca3af" stroke-width="0.8"/>
  <text x="86" y="503" text-anchor="end" class="addr">0x0000_0000</text>

  <!-- ===== 오른쪽 범례 화살표 ===== -->
  <line x1="290" y1="72" x2="318" y2="72" stroke="#ef4444" stroke-width="1"/>
  <text x="322" y="68" style="font:9px 'Courier New',monospace; fill:#b91c1c">0xE000_0000~</text>
  <text x="322" y="79" style="font:8px Arial,sans-serif; fill:#b91c1c">PPB, NVIC, SysTick</text>

  <line x1="290" y1="357" x2="318" y2="357" stroke="#d97706" stroke-width="1"/>
  <text x="322" y="353" style="font:9px 'Courier New',monospace; fill:#92400e">0x4000_0000~</text>
  <text x="322" y="364" style="font:8px Arial,sans-serif; fill:#92400e">STM32: GPIO, TIM, USART...</text>

  <line x1="290" y1="414" x2="318" y2="414" stroke="#10b981" stroke-width="1"/>
  <text x="322" y="410" style="font:9px 'Courier New',monospace; fill:#065f46">0x2000_0000~</text>
  <text x="322" y="421" style="font:8px Arial,sans-serif; fill:#065f46">STM32F4: 128KB SRAM</text>

  <line x1="290" y1="471" x2="318" y2="471" stroke="#3b82f6" stroke-width="1"/>
  <text x="322" y="467" style="font:9px 'Courier New',monospace; fill:#1e3a8a">0x0800_0000~</text>
  <text x="322" y="478" style="font:8px Arial,sans-serif; fill:#1e3a8a">STM32F4: Flash 시작 (미러)</text>

  <!-- 외부 메모리 영역 노트 -->
  <rect x="148" y="215" width="5" height="114" fill="#9ca3af"/>
  <text x="295" y="247" style="font:8px Arial,sans-serif; fill:#9ca3af">외부 메모리/장치 영역</text>
  <text x="295" y="258" style="font:8px Arial,sans-serif; fill:#9ca3af">(단순 MCU에서는 미사용)</text>

  <!-- 하단 출처 -->
  <text x="265" y="514" text-anchor="middle" style="font:8px Arial,sans-serif; fill:#d1d5db">ARM DDI 0403E.e — ARMv7-M Architecture Reference Manual, Table B3-1</text>
</svg>
