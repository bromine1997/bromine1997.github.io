<svg width="560" height="460" viewBox="0 0 560 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .fbox  { fill:#f0f4fa; stroke:#2b4c7e; stroke-width:1.5; }
      .fname { font:13px 'Courier New',monospace; fill:#1f2937; }
      .tname { font:12px Arial,sans-serif; fill:#2b4c7e; font-weight:bold; }
      .tcmd  { font:11px 'Courier New',monospace; fill:#6a1aaa; }
      .note  { font:11px Arial,sans-serif; fill:#6b7280; }
    </style>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#374151"/>
    </marker>
    <marker id="ahd" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#d97706"/>
    </marker>
  </defs>
  <rect width="560" height="460" fill="#fff"/>

  <!-- main.c -->
  <rect x="160" y="20" width="180" height="38" rx="6" class="fbox"/>
  <text x="250" y="44" text-anchor="middle" class="fname">main.c</text>

  <!-- 전처리 -->
  <line x1="250" y1="58" x2="250" y2="88" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="355" y="72" class="tname">전처리기</text>
  <text x="355" y="86" class="tcmd">gcc -E</text>

  <!-- main.i -->
  <rect x="160" y="92" width="180" height="38" rx="6" class="fbox"/>
  <text x="250" y="116" text-anchor="middle" class="fname">main.i</text>

  <!-- 컴파일 -->
  <line x1="250" y1="130" x2="250" y2="160" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="355" y="144" class="tname">컴파일러</text>
  <text x="355" y="158" class="tcmd">gcc -S -mthumb</text>

  <!-- main.s -->
  <rect x="160" y="164" width="180" height="38" rx="6" class="fbox"/>
  <text x="250" y="188" text-anchor="middle" class="fname">main.s</text>

  <!-- 어셈블 -->
  <line x1="250" y1="202" x2="250" y2="232" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="355" y="216" class="tname">어셈블러</text>
  <text x="355" y="230" class="tcmd">arm-none-eabi-as</text>

  <!-- main.o -->
  <rect x="160" y="236" width="180" height="38" rx="6" class="fbox"/>
  <text x="250" y="260" text-anchor="middle" class="fname">main.o</text>

  <!-- 링크 -->
  <line x1="250" y1="274" x2="250" y2="304" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="355" y="287" class="tname">링커</text>
  <text x="355" y="301" class="tcmd">arm-none-eabi-ld</text>

  <!-- .ld 파일 branch -->
  <rect x="18" y="278" width="106" height="26" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="71" y="295" text-anchor="middle" style="font:11px 'Courier New',monospace; fill:#92400e">STM32F4.ld</text>
  <line x1="124" y1="291" x2="248" y2="291" stroke="#d97706" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#ahd)"/>

  <!-- firmware.elf -->
  <rect x="145" y="308" width="210" height="38" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="250" y="332" text-anchor="middle" class="fname" fill="#1e3a8a">firmware.elf</text>

  <!-- objcopy -->
  <line x1="250" y1="346" x2="250" y2="376" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="355" y="359" class="tname">objcopy</text>
  <text x="355" y="374" class="tcmd">-O ihex / -O binary</text>

  <!-- firmware.hex/.bin -->
  <rect x="125" y="380" width="250" height="38" rx="6" fill="#d1fae5" stroke="#065f46" stroke-width="1.5"/>
  <text x="250" y="404" text-anchor="middle" class="fname" fill="#064e3b">firmware.hex / .bin</text>

  <!-- 하단 설명 -->
  <text x="250" y="442" text-anchor="middle" class="note">플래시에 올릴 수 있는 최종 형태</text>
</svg>
