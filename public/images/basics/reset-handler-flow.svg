<svg width="560" height="670" viewBox="0 0 560 670" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .step { font:bold 12px Arial,sans-serif; fill:#111827; }
      .sub  { font:11px Arial,sans-serif; fill:#4b5563; }
      .note { font:10px Arial,sans-serif; fill:#6b7280; }
    </style>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#374151"/>
    </marker>
  </defs>
  <rect width="560" height="670" fill="white"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" style="font:bold 14px Arial,sans-serif; fill:#111827">Cortex-M 부팅 흐름: 리셋 → main()</text>

  <!-- ── 모든 박스: x=90, width=380, center=280 ── -->

  <!-- [0] 리셋 / 전원 인가  (pill) -->
  <rect x="90" y="38" width="380" height="44" rx="22" fill="#111111" stroke="#111111" stroke-width="1.5"/>
  <text x="280" y="65" text-anchor="middle" style="font:bold 12px Arial,sans-serif; fill:white">리셋 / 전원 인가</text>

  <line x1="280" y1="84" x2="280" y2="110" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- [1] 벡터 테이블 [0] -->
  <rect x="90" y="114" width="380" height="52" rx="8" fill="white" stroke="#111111" stroke-width="1.5"/>
  <text x="280" y="135" text-anchor="middle" class="step">벡터 테이블 [0] 읽기</text>
  <text x="280" y="153" text-anchor="middle" class="sub">0x0000_0000 → MSP 초기값 로드 (RAM 끝 주소)</text>

  <line x1="280" y1="168" x2="280" y2="194" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- [2] 벡터 테이블 [1] -->
  <rect x="90" y="198" width="380" height="52" rx="8" fill="white" stroke="#111111" stroke-width="1.5"/>
  <text x="280" y="219" text-anchor="middle" class="step">벡터 테이블 [1] 읽기</text>
  <text x="280" y="237" text-anchor="middle" class="sub">0x0000_0004 → Reset_Handler 주소  (LSB=1, Thumb)</text>

  <line x1="280" y1="252" x2="280" y2="278" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- [3] Reset_Handler 진입 -->
  <rect x="90" y="282" width="380" height="36" rx="8" fill="white" stroke="#111111" stroke-width="2"/>
  <text x="280" y="305" text-anchor="middle" class="step">Reset_Handler 진입</text>

  <!-- startup code 브라켓: 박스 [3] top ~ 박스 [6] bottom 사이 -->
  <line x1="84" y1="282" x2="84" y2="570" stroke="#666666" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="0" y="0" transform="translate(18,426) rotate(-90)" text-anchor="middle"
        style="font:10px Arial,sans-serif; fill:#555555">startup code</text>

  <line x1="280" y1="320" x2="280" y2="346" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- [4] .data 복사 -->
  <rect x="90" y="350" width="380" height="52" rx="8" fill="white" stroke="#111111" stroke-width="1.5"/>
  <text x="280" y="371" text-anchor="middle" class="step">.data 섹션 복사</text>
  <text x="280" y="389" text-anchor="middle" class="sub">Flash LMA → RAM VMA  (_sidata → _sdata 초기값 전달)</text>

  <line x1="280" y1="404" x2="280" y2="430" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- [5] .bss 초기화 -->
  <rect x="90" y="434" width="380" height="52" rx="8" fill="white" stroke="#111111" stroke-width="1.5"/>
  <text x="280" y="455" text-anchor="middle" class="step">.bss 섹션 초기화</text>
  <text x="280" y="473" text-anchor="middle" class="sub">_sbss ~ _ebss 전체 0으로 클리어  (C 표준 보장)</text>

  <line x1="280" y1="488" x2="280" y2="514" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- [6] SystemInit -->
  <rect x="90" y="518" width="380" height="52" rx="8" fill="white" stroke="#111111" stroke-width="1.5"/>
  <text x="280" y="539" text-anchor="middle" class="step">SystemInit()</text>
  <text x="280" y="557" text-anchor="middle" class="sub">HSI → PLL → SYSCLK 100 MHz  (STM32F411RE)</text>

  <line x1="280" y1="572" x2="280" y2="598" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- [7] main()  (pill) -->
  <rect x="90" y="602" width="380" height="44" rx="22" fill="#111111" stroke="#111111" stroke-width="1.5"/>
  <text x="280" y="629" text-anchor="middle" style="font:bold 13px Arial,sans-serif; fill:white">main()</text>

  <!-- 하단 설명 -->
  <text x="280" y="660" text-anchor="middle" class="note">이 시점: 스택 · 전역변수 초기화 · 클럭 설정 완료</text>
</svg>
