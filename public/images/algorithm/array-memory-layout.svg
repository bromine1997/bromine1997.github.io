<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="'Courier New', monospace">

  <!-- Background -->
  <rect width="760" height="300" fill="#0d1117" rx="12"/>

  <!-- ── STACK SECTION ── -->
  <text x="30" y="32" fill="#8b949e" font-size="13" font-weight="bold" letter-spacing="1">STACK</text>
  <line x1="30" y1="38" x2="210" y2="38" stroke="#30363d" stroke-width="1"/>

  <!-- Struct box: data -->
  <rect x="30" y="48" width="180" height="44" fill="#161b22" stroke="#1f6feb" stroke-width="1.5" rx="4"/>
  <text x="42" y="66" fill="#79c0ff" font-size="11">data</text>
  <text x="42" y="83" fill="#e6edf3" font-size="12">0x5000</text>

  <!-- Struct box: size -->
  <rect x="30" y="96" width="180" height="44" fill="#161b22" stroke="#30363d" stroke-width="1.5" rx="4"/>
  <text x="42" y="114" fill="#8b949e" font-size="11">size</text>
  <text x="42" y="131" fill="#e6edf3" font-size="12">5</text>

  <!-- Struct box: capacity -->
  <rect x="30" y="144" width="180" height="44" fill="#161b22" stroke="#30363d" stroke-width="1.5" rx="4"/>
  <text x="42" y="162" fill="#8b949e" font-size="11">capacity</text>
  <text x="42" y="179" fill="#e6edf3" font-size="12">8</text>

  <!-- Struct label -->
  <text x="30" y="215" fill="#6e7681" font-size="11">DynamicArray *da</text>
  <text x="30" y="232" fill="#6e7681" font-size="11">Stack: 24 bytes</text>

  <!-- ── ARROW ── -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#58a6ff"/>
    </marker>
  </defs>
  <line x1="212" y1="70" x2="330" y2="70" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,3"/>
  <text x="240" y="62" fill="#58a6ff" font-size="10">da-&gt;data</text>

  <!-- ── HEAP SECTION ── -->
  <text x="340" y="32" fill="#8b949e" font-size="13" font-weight="bold" letter-spacing="1">HEAP</text>
  <line x1="340" y1="38" x2="730" y2="38" stroke="#30363d" stroke-width="1"/>

  <!-- Heap cells: filled (indices 0-4) -->
  <rect x="340" y="48" width="48" height="44" fill="#1a2e1a" stroke="#238636" stroke-width="1.5" rx="3"/>
  <text x="364" y="71" fill="#3fb950" font-size="14" text-anchor="middle" font-weight="bold">10</text>
  <text x="364" y="101" fill="#6e7681" font-size="10" text-anchor="middle">arr[0]</text>
  <text x="364" y="113" fill="#484f58" font-size="9" text-anchor="middle">0x5000</text>

  <rect x="392" y="48" width="48" height="44" fill="#1a2e1a" stroke="#238636" stroke-width="1.5" rx="3"/>
  <text x="416" y="71" fill="#3fb950" font-size="14" text-anchor="middle" font-weight="bold">20</text>
  <text x="416" y="101" fill="#6e7681" font-size="10" text-anchor="middle">arr[1]</text>
  <text x="416" y="113" fill="#484f58" font-size="9" text-anchor="middle">0x5004</text>

  <rect x="444" y="48" width="48" height="44" fill="#1a2e1a" stroke="#238636" stroke-width="1.5" rx="3"/>
  <text x="468" y="71" fill="#3fb950" font-size="14" text-anchor="middle" font-weight="bold">30</text>
  <text x="468" y="101" fill="#6e7681" font-size="10" text-anchor="middle">arr[2]</text>
  <text x="468" y="113" fill="#484f58" font-size="9" text-anchor="middle">0x5008</text>

  <rect x="496" y="48" width="48" height="44" fill="#1a2e1a" stroke="#238636" stroke-width="1.5" rx="3"/>
  <text x="520" y="71" fill="#3fb950" font-size="14" text-anchor="middle" font-weight="bold">40</text>
  <text x="520" y="101" fill="#6e7681" font-size="10" text-anchor="middle">arr[3]</text>
  <text x="520" y="113" fill="#484f58" font-size="9" text-anchor="middle">0x500C</text>

  <rect x="548" y="48" width="48" height="44" fill="#1a2e1a" stroke="#238636" stroke-width="1.5" rx="3"/>
  <text x="572" y="71" fill="#3fb950" font-size="14" text-anchor="middle" font-weight="bold">50</text>
  <text x="572" y="101" fill="#6e7681" font-size="10" text-anchor="middle">arr[4]</text>
  <text x="572" y="113" fill="#484f58" font-size="9" text-anchor="middle">0x5010</text>

  <!-- Heap cells: empty (indices 5-7) -->
  <rect x="600" y="48" width="48" height="44" fill="#161b22" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4,3" rx="3"/>
  <text x="624" y="71" fill="#484f58" font-size="18" text-anchor="middle">·</text>
  <text x="624" y="101" fill="#484f58" font-size="10" text-anchor="middle">arr[5]</text>

  <rect x="652" y="48" width="48" height="44" fill="#161b22" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4,3" rx="3"/>
  <text x="676" y="71" fill="#484f58" font-size="18" text-anchor="middle">·</text>
  <text x="676" y="101" fill="#484f58" font-size="10" text-anchor="middle">arr[6]</text>

  <rect x="704" y="48" width="48" height="44" fill="#161b22" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4,3" rx="3"/>
  <text x="728" y="71" fill="#484f58" font-size="18" text-anchor="middle">·</text>
  <text x="728" y="101" fill="#484f58" font-size="10" text-anchor="middle">arr[7]</text>

  <!-- Bracket for used -->
  <line x1="340" y1="125" x2="340" y2="133" stroke="#3fb950" stroke-width="1.5"/>
  <line x1="340" y1="129" x2="596" y2="129" stroke="#3fb950" stroke-width="1.5"/>
  <line x1="596" y1="125" x2="596" y2="133" stroke="#3fb950" stroke-width="1.5"/>
  <text x="468" y="147" fill="#3fb950" font-size="11" text-anchor="middle">size = 5  (사용 중)</text>

  <!-- Bracket for capacity -->
  <line x1="340" y1="158" x2="340" y2="166" stroke="#58a6ff" stroke-width="1.5"/>
  <line x1="340" y1="162" x2="750" y2="162" stroke="#58a6ff" stroke-width="1.5"/>
  <line x1="750" y1="158" x2="750" y2="166" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="545" y="180" fill="#58a6ff" font-size="11" text-anchor="middle">capacity = 8  (할당된 총 공간: 32 bytes)</text>

  <!-- Note -->
  <text x="340" y="215" fill="#6e7681" font-size="11">연속된 메모리 블록 → arr[i] 접근 = *(data + i) = O(1)</text>
  <text x="340" y="232" fill="#6e7681" font-size="11">size == capacity 되면 realloc()으로 2배 확장</text>

</svg>
