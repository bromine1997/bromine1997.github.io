<svg width="1000" height="520" viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .label { font: 12px 'Courier New', monospace; fill:#1a1aaa; }
      .comp  { font: 12px 'Courier New', monospace; fill:#111; }
      .pin   { font: 11px 'Courier New', monospace; fill:#2e7d32; }
      .ctrl  { font: 11px 'Courier New', monospace; fill:#6a1aaa; }
      .title { font: 15px 'Arial', sans-serif; fill:#111; }
      .desc  { font: 12px 'Arial', sans-serif; fill:#888; }
      .note  { font: 11px 'Arial', sans-serif; fill:#555; }
    </style>
  </defs>

  <rect width="1000" height="520" fill="#ffffff"/>

  <!-- ==================== PUSH-PULL ==================== -->

  <!-- MCU 블록 (내부 드라이버) -->
  <rect x="20" y="170" width="90" height="130" rx="6" fill="#f0f4fa" stroke="#2b4c7e" stroke-width="1.5"/>
  <text x="65" y="192" text-anchor="middle" class="comp" fill="#2b4c7e">MCU</text>
  <text x="65" y="208" text-anchor="middle" class="note">Internal</text>
  <text x="65" y="221" text-anchor="middle" class="note">Driver</text>
  <!-- 게이트 제어 출력 2개 -->
  <circle cx="110" cy="205" r="3" fill="#6a1aaa"/>
  <circle cx="110" cy="270" r="3" fill="#6a1aaa"/>
  <text x="114" y="200" class="ctrl">CTRL_P</text>
  <text x="114" y="265" class="ctrl">CTRL_N</text>

  <!-- CTRL_P → PMOS gate -->
  <line x1="110" y1="205" x2="200" y2="205" stroke="#6a1aaa" stroke-width="1.2" stroke-dasharray="5 3"/>
  <!-- CTRL_N → NMOS gate -->
  <line x1="110" y1="270" x2="200" y2="270" stroke="#6a1aaa" stroke-width="1.2" stroke-dasharray="5 3"/>

  <!-- VDD -->
  <line x1="270" y1="138" x2="270" y2="110" stroke="#111" stroke-width="1.5"/>
  <rect x="253" y="92" width="34" height="20" fill="none" stroke="#1a1aaa" stroke-width="1.2" stroke-dasharray="4 2"/>
  <text x="256" y="106" class="label">+VDD</text>
  <polygon points="265,112 275,112 270,102" fill="#111"/>

  <!-- PMOS -->
  <line x1="200" y1="205" x2="228" y2="205" stroke="#111" stroke-width="1.5"/>
  <line x1="228" y1="193" x2="228" y2="217" stroke="#111" stroke-width="2.5"/>
  <line x1="234" y1="193" x2="234" y2="217" stroke="#111" stroke-width="2.5"/>
  <line x1="234" y1="195" x2="270" y2="195" stroke="#111" stroke-width="1.5"/>
  <line x1="270" y1="195" x2="270" y2="138" stroke="#111" stroke-width="1.5"/>
  <line x1="234" y1="215" x2="270" y2="215" stroke="#111" stroke-width="1.5"/>
  <line x1="270" y1="215" x2="270" y2="238" stroke="#111" stroke-width="1.5"/>
  <polygon points="226,201 234,205 226,209" fill="#111"/>
  <text x="278" y="200" class="comp">Q1</text>
  <text x="278" y="213" class="comp">PMOS</text>
  <rect x="218" y="182" width="76" height="46" fill="none" stroke="#c8a800" stroke-width="1.2" stroke-dasharray="6 3"/>

  <!-- Output node (두 트랜지스터가 만나는 노드) -->
  <circle cx="270" cy="245" r="4" fill="#2e7d32"/>
  <!-- OUTPUT PIN 표시 -->
  <line x1="270" y1="245" x2="340" y2="245" stroke="#2e7d32" stroke-width="2"/>
  <polygon points="338,240 352,245 338,250" fill="#2e7d32"/>
  <rect x="355" y="233" width="88" height="24" fill="none" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="399" y="249" text-anchor="middle" class="pin">OUTPUT PIN</text>
  <text x="399" y="270" text-anchor="middle" class="note">(외부 핀)</text>

  <!-- NMOS -->
  <line x1="200" y1="270" x2="228" y2="270" stroke="#111" stroke-width="1.5"/>
  <line x1="228" y1="258" x2="228" y2="282" stroke="#111" stroke-width="2.5"/>
  <line x1="234" y1="258" x2="234" y2="282" stroke="#111" stroke-width="2.5"/>
  <line x1="234" y1="260" x2="270" y2="260" stroke="#111" stroke-width="1.5"/>
  <line x1="270" y1="260" x2="270" y2="245" stroke="#111" stroke-width="1.5"/>
  <line x1="234" y1="280" x2="270" y2="280" stroke="#111" stroke-width="1.5"/>
  <line x1="270" y1="280" x2="270" y2="320" stroke="#111" stroke-width="1.5"/>
  <polygon points="234,266 242,270 234,274" fill="#111"/>
  <text x="278" y="268" class="comp">Q2</text>
  <text x="278" y="281" class="comp">NMOS</text>
  <rect x="218" y="248" width="76" height="46" fill="none" stroke="#c8a800" stroke-width="1.2" stroke-dasharray="6 3"/>

  <!-- GND -->
  <line x1="252" y1="320" x2="288" y2="320" stroke="#111" stroke-width="1.5"/>
  <line x1="258" y1="328" x2="282" y2="328" stroke="#111" stroke-width="1.5"/>
  <line x1="264" y1="336" x2="276" y2="336" stroke="#111" stroke-width="1.5"/>

  <!-- 타이틀 -->
  <text x="230" y="400" text-anchor="middle" class="title">Push-Pull</text>
  <text x="230" y="420" text-anchor="middle" class="desc">내부 드라이버가 PMOS/NMOS 게이트를 제어</text>
  <text x="230" y="438" text-anchor="middle" class="desc">외부 핀 = 두 트랜지스터가 만나는 노드</text>

  <!-- ==================== OPEN-DRAIN ==================== -->

  <!-- MCU 블록 -->
  <rect x="550" y="200" width="90" height="80" rx="6" fill="#f0f4fa" stroke="#2b4c7e" stroke-width="1.5"/>
  <text x="595" y="222" text-anchor="middle" class="comp" fill="#2b4c7e">MCU</text>
  <text x="595" y="238" text-anchor="middle" class="note">Internal</text>
  <text x="595" y="251" text-anchor="middle" class="note">Driver</text>
  <!-- 게이트 제어 출력 1개만 -->
  <circle cx="640" cy="240" r="3" fill="#6a1aaa"/>
  <text x="644" y="235" class="ctrl">CTRL_N</text>

  <!-- CTRL_N → NMOS gate -->
  <line x1="640" y1="240" x2="730" y2="240" stroke="#6a1aaa" stroke-width="1.2" stroke-dasharray="5 3"/>

  <!-- PMOS 없음 표시 -->
  <rect x="660" y="130" width="76" height="46" fill="#f9f9f9" stroke="#ccc" stroke-width="1.2" stroke-dasharray="5 3"/>
  <line x1="666" y1="136" x2="730" y2="170" stroke="#c62828" stroke-width="2"/>
  <line x1="730" y1="136" x2="666" y2="170" stroke="#c62828" stroke-width="2"/>
  <text x="698" y="158" text-anchor="middle" class="comp" fill="#bbb">PMOS</text>
  <text x="698" y="195" text-anchor="middle" class="note" fill="#c62828">unused</text>

  <!-- NMOS -->
  <line x1="730" y1="240" x2="758" y2="240" stroke="#111" stroke-width="1.5"/>
  <line x1="758" y1="228" x2="758" y2="252" stroke="#111" stroke-width="2.5"/>
  <line x1="764" y1="228" x2="764" y2="252" stroke="#111" stroke-width="2.5"/>
  <line x1="764" y1="230" x2="800" y2="230" stroke="#111" stroke-width="1.5"/>
  <line x1="800" y1="230" x2="800" y2="210" stroke="#111" stroke-width="1.5"/>
  <line x1="764" y1="250" x2="800" y2="250" stroke="#111" stroke-width="1.5"/>
  <line x1="800" y1="250" x2="800" y2="290" stroke="#111" stroke-width="1.5"/>
  <polygon points="756,236 764,240 756,244" fill="#111"/>
  <text x="808" y="240" class="comp">Q3</text>
  <text x="808" y="253" class="comp">NMOS</text>
  <rect x="748" y="218" width="76" height="46" fill="none" stroke="#c8a800" stroke-width="1.2" stroke-dasharray="6 3"/>

  <!-- Drain 노드 = OUTPUT PIN -->
  <circle cx="800" cy="210" r="4" fill="#2e7d32"/>
  <line x1="800" y1="210" x2="870" y2="210" stroke="#2e7d32" stroke-width="2"/>
  <polygon points="868,205 882,210 868,215" fill="#2e7d32"/>
  <rect x="885" y="198" width="88" height="24" fill="none" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="929" y="214" text-anchor="middle" class="pin">OUTPUT PIN</text>
  <text x="929" y="235" text-anchor="middle" class="note">(외부 핀 = drain)</text>

  <!-- pull-up R → VDD -->
  <line x1="800" y1="210" x2="800" y2="168" stroke="#111" stroke-width="1.5"/>
  <polyline points="800,168 788,160 812,152 788,144 812,136 788,128 812,120 800,112" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="818" y="148" class="comp">R_PU</text>
  <text x="818" y="162" class="comp">10K</text>
  <rect x="782" y="106" width="66" height="68" fill="none" stroke="#c8a800" stroke-width="1.2" stroke-dasharray="6 3"/>
  <line x1="800" y1="112" x2="800" y2="88" stroke="#111" stroke-width="1.5"/>
  <rect x="783" y="70" width="34" height="20" fill="none" stroke="#1a1aaa" stroke-width="1.2" stroke-dasharray="4 2"/>
  <text x="786" y="84" class="label">+VDD</text>
  <polygon points="795,90 805,90 800,80" fill="#111"/>

  <!-- GND -->
  <line x1="782" y1="290" x2="818" y2="290" stroke="#111" stroke-width="1.5"/>
  <line x1="788" y1="298" x2="812" y2="298" stroke="#111" stroke-width="1.5"/>
  <line x1="794" y1="306" x2="806" y2="306" stroke="#111" stroke-width="1.5"/>

  <!-- 타이틀 -->
  <text x="760" y="400" text-anchor="middle" class="title">Open-Drain</text>
  <text x="760" y="420" text-anchor="middle" class="desc">내부 드라이버가 NMOS 게이트만 제어</text>
  <text x="760" y="438" text-anchor="middle" class="desc">외부 핀 = NMOS drain / High는 pull-up이 담당</text>
</svg>
