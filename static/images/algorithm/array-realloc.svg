  <rect x="464" y="300" width="44" height="36" fill="#1a2e1a" stroke="#238636" stroke-width="1.5" rx="3"/>
  <text x="486" y="323" fill="#3fb950" font-size="13" text-anchor="middle">30</text>
  <rect x="512" y="300" width="44" height="36" fill="#1a2e1a" stroke="#238636" stroke-width="1.5" rx="3"/>
  <text x="534" y="323" fill="#3fb950" font-size="13" text-anchor="middle">40</text>
  <rect x="560" y="300" width="44" height="36" fill="#161b22" stroke="#238636" stroke-width="1.5" stroke-dasharray="4,3" rx="3"/>
  <text x="582" y="323" fill="#484f58" font-size="16" text-anchor="middle">·</text>
  <rect x="608" y="300" width="44" height="36" fill="#161b22" stroke="#238636" stroke-width="1.5" stroke-dasharray="4,3" rx="3"/>
  <text x="630" y="323" fill="#484f58" font-size="16" text-anchor="middle">·</text>
  <rect x="656" y="300" width="44" height="36" fill="#161b22" stroke="#238636" stroke-width="1.5" stroke-dasharray="4,3" rx="3"/>
  <text x="678" y="323" fill="#484f58" font-size="16" text-anchor="middle">·</text>
  <rect x="704" y="300" width="44" height="36" fill="#161b22" stroke="#238636" stroke-width="1.5" stroke-dasharray="4,3" rx="3"/>
  <text x="726" y="323" fill="#484f58" font-size="16" text-anchor="middle">·</text>

  <!-- Labels -->
  <text x="80" y="352" fill="#484f58" font-size="10">기존 주소 해제됨</text>
  <text x="368" y="352" fill="#58a6ff" font-size="11">새 주소 → 데이터 복사 완료, 포인터 변경됨</text>

