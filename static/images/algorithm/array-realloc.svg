  <line x1="102" y1="258" x2="102" y2="275" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="102" y1="275" x2="390" y2="275" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="390" y1="275" x2="390" y2="288" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="3,2"/>
  <polygon points="384,286 390,296 396,286" fill="#58a6ff"/>

