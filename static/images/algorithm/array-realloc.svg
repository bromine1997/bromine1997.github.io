  <text x="102" y="316" fill="#484f58" font-size="9" text-anchor="middle">freed</text>
  <rect x="128" y="300" width="44" height="36" fill="#161b22" stroke="#484f58" stroke-width="1" stroke-dasharray="3,3" rx="3"/>
  <text x="150" y="316" fill="#484f58" font-size="9" text-anchor="middle">freed</text>
  <rect x="176" y="300" width="44" height="36" fill="#161b22" stroke="#484f58" stroke-width="1" stroke-dasharray="3,3" rx="3"/>
  <text x="198" y="316" fill="#484f58" font-size="9" text-anchor="middle">freed</text>
  <rect x="224" y="300" width="44" height="36" fill="#161b22" stroke="#484f58" stroke-width="1" stroke-dasharray="3,3" rx="3"/>
