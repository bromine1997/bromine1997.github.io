<svg width="580" height="360" viewBox="0 0 580 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title  { font:13px Arial,sans-serif; fill:#1f2937; font-weight:bold; }
      .slabel { font:12px 'Courier New',monospace; fill:#1f2937; }
      .sdesc  { font:10px Arial,sans-serif; fill:#6b7280; }
      .note   { font:11px Arial,sans-serif; fill:#6b7280; }
      .arrlbl { font:10px Arial,sans-serif; fill:#374151; }
    </style>
    <marker id="ah" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="#374151"/>
    </marker>
    <marker id="ahb" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0,7 2.5,0 5" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect width="580" height="360" fill="#fff"/>

  <!-- ===== ELF 파일 (왼쪽) ===== -->
  <rect x="20" y="20" width="185" height="310" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="112" y="42" text-anchor="middle" class="title">firmware.elf</text>

  <!-- .text -->
  <rect x="28" y="50" width="169" height="55" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="112" y="73" text-anchor="middle" class="slabel">.text</text>
  <text x="112" y="88" text-anchor="middle" class="sdesc">함수 코드, 명령어</text>

  <!-- .rodata -->
  <rect x="28" y="112" width="169" height="38" rx="4" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/>
  <text x="112" y="130" text-anchor="middle" class="slabel">.rodata</text>
  <text x="112" y="143" text-anchor="middle" class="sdesc">const 상수, 문자열</text>

  <!-- .data -->
  <rect x="28" y="157" width="169" height="50" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="1"/>
  <text x="112" y="178" text-anchor="middle" class="slabel">.data  (LMA)</text>
  <text x="112" y="193" text-anchor="middle" class="sdesc">초기값 있는 전역변수</text>

  <!-- .bss -->
  <rect x="28" y="214" width="169" height="38" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="112" y="232" text-anchor="middle" class="slabel">.bss  (크기만)</text>
  <text x="112" y="246" text-anchor="middle" class="sdesc">초기값 없는 전역변수</text>

  <!-- .symtab / debug -->
  <rect x="28" y="259" width="169" height="38" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="112" y="277" text-anchor="middle" class="slabel">.symtab / .debug</text>
  <text x="112" y="291" text-anchor="middle" class="sdesc">심볼, 디버그 정보</text>

  <!-- ===== Flash (오른쪽 위) ===== -->
  <rect x="380" y="20" width="175" height="165" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="467" y="40" text-anchor="middle" class="title" fill="#1d4ed8">Flash</text>

  <rect x="388" y="48" width="159" height="45" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="467" y="68" text-anchor="middle" class="slabel">.text</text>
  <text x="467" y="82" text-anchor="middle" class="sdesc">실행 중 직접 접근</text>

  <rect x="388" y="98" width="159" height="32" rx="4" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/>
  <text x="467" y="119" text-anchor="middle" class="slabel">.rodata</text>

  <rect x="388" y="135" width="159" height="38" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="1"/>
  <text x="467" y="153" text-anchor="middle" class="slabel">.data 초기값</text>
  <text x="467" y="167" text-anchor="middle" class="sdesc">LMA: 저장 위치</text>

  <!-- ===== RAM (오른쪽 아래) ===== -->
  <rect x="380" y="198" width="175" height="130" rx="6" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  <text x="467" y="218" text-anchor="middle" class="title" fill="#065f46">RAM</text>

  <rect x="388" y="225" width="159" height="38" rx="4" fill="#bbf7d0" stroke="#10b981" stroke-width="1"/>
  <text x="467" y="243" text-anchor="middle" class="slabel">.data  (VMA)</text>
  <text x="467" y="257" text-anchor="middle" class="sdesc">부팅 시 복사됨</text>

  <rect x="388" y="268" width="159" height="38" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="467" y="286" text-anchor="middle" class="slabel">.bss</text>
  <text x="467" y="300" text-anchor="middle" class="sdesc">부팅 시 0으로 초기화</text>

  <!-- ===== 화살표 ===== -->
  <!-- .text → Flash .text -->
  <line x1="197" y1="77" x2="378" y2="70" stroke="#374151" stroke-width="1.2" marker-end="url(#ah)"/>

  <!-- .rodata → Flash .rodata -->
  <line x1="197" y1="131" x2="378" y2="114" stroke="#374151" stroke-width="1.2" marker-end="url(#ah)"/>

  <!-- .data → Flash .data 초기값 -->
  <line x1="197" y1="175" x2="378" y2="154" stroke="#374151" stroke-width="1.2" marker-end="url(#ah)"/>

  <!-- .data → RAM .data (부팅 시 복사, 꺾인 화살표) -->
  <polyline points="197,182 280,182 280,244 378,244" fill="none" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#ahb)"/>
  <text x="240" y="222" text-anchor="middle" class="arrlbl" fill="#1d4ed8">부팅 시 복사</text>

  <!-- .bss → RAM .bss -->
  <line x1="197" y1="233" x2="378" y2="287" stroke="#374151" stroke-width="1.2" stroke-dasharray="6 3" marker-end="url(#ah)"/>
  <text x="295" y="278" class="arrlbl">0으로 초기화</text>

  <!-- .symtab / debug: X 표시 (MCU에 올라가지 않음) -->
  <text x="245" y="278" text-anchor="middle" class="note" fill="#9ca3af">MCU에</text>
  <text x="245" y="290" text-anchor="middle" class="note" fill="#9ca3af">올라가지</text>
  <text x="245" y="302" text-anchor="middle" class="note" fill="#9ca3af">않음</text>
  <line x1="205" y1="278" x2="238" y2="278" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 3"/>
</svg>
